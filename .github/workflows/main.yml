name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          GRADLE_FILE=$(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: No build.gradle or build.gradle.kts found in repository!"
            echo "Files in repository:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

          DIR=$(dirname "$GRADLE_FILE")
          if [ "$(basename "$DIR")" = "app" ]; then
            ROOT_DIR=$(dirname "$DIR")
          else
            ROOT_DIR="$DIR"
          fi

          echo "Building Android project in: $ROOT_DIR"
          cd "$ROOT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSP-SMS-Android-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
